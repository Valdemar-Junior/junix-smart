<!doctype html>
<html lang="pt-BR" theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
<link rel="icon" type="image/svg+xml" href="assets/marca/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/guarda.js"></script>
<style>
  :root { --fundo: #f2f1f6; --acrilico: #fff; --texto: #363636; --campo: #fff; --borda: #d6d6db; --destaque: #ff035b; --azul: #2f84ec; --erro: #a94442; --erro-fundo: #f2dede; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fundo: #1c1c1e; --acrilico: #2c2c2e; --texto: #dfdfdf; --campo: #1c1c1e; --borda: #3a3a3c; --erro: #f5b5b5; --erro-fundo: #4a2626; }
  }
  :root[data-theme="dark"] { --fundo: #1c1c1e; --acrilico: #2c2c2e; --texto: #dfdfdf; --campo: #1c1c1e; --borda: #3a3a3c; --erro: #f5b5b5; --erro-fundo: #4a2626; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: 'Work Sans', sans-serif; color: var(--texto); background: var(--fundo); }
  .cartao { width: 100%; max-width: 380px; background: var(--acrilico); border-radius: 15px; padding: 32px 28px;
    box-shadow: 0 0 1rem 0 rgba(0,0,0,0.25); }
  .marca { height: 56px; margin: 0 auto 24px; background: url(assets/marca/logo.svg) no-repeat center / auto 52px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .marca { background-image: url(assets/marca/logo_claro.svg); } }
  :root[data-theme="dark"] .marca { background-image: url(assets/marca/logo_claro.svg); }
  label { display: block; font-size: 14px; margin: 14px 0 6px; }
  input { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--borda); padding: 0 12px;
    font: 15px 'Work Sans', sans-serif; color: var(--texto); background: var(--campo); outline: none; }
  input:focus { border-color: var(--azul); box-shadow: 0 0 0 3px rgba(47,132,236,0.25); }
  button { width: 100%; height: 46px; margin-top: 22px; border: 0; border-radius: 10px; background: var(--azul);
    color: #fff; font: 600 16px 'Work Sans', sans-serif; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .erro { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px; color: var(--erro); background: var(--erro-fundo); }
  .nota { margin-top: 18px; font-size: 12px; opacity: .65; text-align: center; }
</style>
</head>
<body>
<form class="cartao" id="entrar" autocomplete="on">
  <div class="marca" role="img" aria-label="Logotipo"></div>
  <label for="email">E-mail</label>
  <input id="email" type="email" autocomplete="username" required>
  <label for="senha">Senha</label>
  <input id="senha" type="password" autocomplete="current-password" required>
  <button type="submit" id="botao">Entrar</button>
  <div class="erro" id="erro" role="alert"></div>
  <div class="nota">Sistema de estudo — acesso restrito.</div>
</form>
<script>
  (function () {
    var sb = window.ERP_SB;
    var volta = new URLSearchParams(location.search).get('volta');
    // só aceita voltar para uma página deste mesmo site
    if (!volta || volta.charAt(0) !== '/' || volta.charAt(1) === '/') volta = 'menu/cadastros.html';
    window.ERP_SESSAO.then(function (s) { if (s) location.replace(volta); });

    var form = document.getElementById('entrar'), erro = document.getElementById('erro'), botao = document.getElementById('botao');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      erro.style.display = 'none';
      botao.disabled = true; botao.textContent = 'Entrando...';
      sb.auth.signInWithPassword({ email: document.getElementById('email').value.trim(), password: document.getElementById('senha').value })
        .then(function (r) {
          if (r.error) throw r.error;
          location.replace(volta);
        })
        .catch(function (err) {
          erro.textContent = /Invalid login/i.test(err.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + err.message;
          erro.style.display = 'block';
          botao.disabled = false; botao.textContent = 'Entrar';
        });
    });
  })();
</script>
</body>
</html>
