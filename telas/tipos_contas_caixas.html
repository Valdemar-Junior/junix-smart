<!doctype html>
<html lang="pt-BR" theme-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tipo de Conta Caixa</title>
<link rel="icon" type="image/svg+xml" href="../assets/marca/favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/guarda.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Valores extraídos do CSS original (application.css / menu.css) */
  :root {
    --fundo: #f2f1f6;
    --acrilico: #ffffff;
    --texto: #363636;
    --borda-botao: #36363666;
    --hover-botao: #f3f3f333;
    --destaque: #ff035b;
    --sombra: 0 0 1rem 0 rgba(0,0,0,0.25);
    --sombra-pesquisa: 0 0 1rem 0 rgba(0,0,0,0.2);
    --placeholder: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    html[theme-mode=auto] {
      --fundo: #1c1c1e;
      --acrilico: #2c2c2e;
      --texto: #dfdfdf;
      --borda-botao: #dfdfdf66;
      --hover-botao: #1c1c1e33;
    }
  }
  html[theme-mode=dark] {
    --fundo: #141a1f;
    --acrilico: #232a2f;
    --texto: #dfdfdf;
    --borda-botao: #dfdfdf66;
    --hover-botao: #141a1f33;
  }

  * { box-sizing: border-box; }
  html { font-size: 10px; }
  body {
    margin: 0;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    color: var(--texto);
    background: var(--fundo);
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  .acrilico {
    background: var(--acrilico);
    box-shadow: var(--sombra);
    border-radius: 15px;
  }

  /* ---------- Menu lateral ---------- */
  #sidebar {
    position: absolute;
    top: 0; left: 0;
    width: 250px;
    padding-right: 15px;
  }
  .sidebar-brand {
    height: 51px;
    margin: 15px 0 15px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
  }
  .logo-marca {
    width: 48px; height: 48px;
  }
  .logo-texto { line-height: 1; }
  .logo-texto strong {
    display: block;
    font-size: 26px; font-weight: 600; letter-spacing: 0.5px;
    color: var(--texto);
  }
  .logo-texto span {
    display: block;
    font-size: 12px; letter-spacing: 6px; text-align: center;
    color: var(--texto);
  }
  #div_pesquisa_programa_menu {
    margin: 0 0 0 10px;
  }
  #div_pesquisa_programa_menu input {
    width: 100%;
    height: 51px;
    border: none;
    border-radius: 15px;
    padding: 0 12px;
    font: 15px 'Work Sans', sans-serif;
    color: var(--texto);
    background: var(--acrilico);
    box-shadow: var(--sombra-pesquisa);
    outline: none;
  }
  #div_pesquisa_programa_menu input::placeholder { color: var(--placeholder); }
  .sidebar-nav { list-style: none; margin: 0; padding: 0; }
  .espacamento-itens-menu {
    margin: 15px 0 15px 15px;
    height: 51px;
  }
  .espacamento-itens-menu a {
    display: flex;
    align-items: center;
    height: 100%;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.2px;
  }
  .espacamento-itens-menu svg {
    width: 22px; height: 22px;
    margin-right: 13px;
    flex: none;
    color: var(--destaque);
  }
  .espacamento-itens-menu .externo {
    width: 16px; height: 16px; margin: 0 0 0 10px; color: var(--texto);
  }

  /* ---------- Barra superior ---------- */
  #conteudo {
    margin-left: 250px;
    padding: 15px 15px 15px 0;
  }
  #barra_superior {
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 15px;
  }
  #barra_superior .titulo {
    display: flex; align-items: center; gap: 15px;
    font-size: 18px; font-weight: 400;
  }
  #barra_superior .titulo svg { width: 20px; height: 20px; }
  #barra_superior .direita {
    margin-left: auto;
    display: flex; align-items: center; gap: 22px;
  }
  .descricao-filial-menu {
    text-transform: uppercase;
    font-size: 12px; font-weight: 400;
  }
  .icone-topo { position: relative; display: flex; align-items: center; gap: 2px; }
  .icone-topo svg { width: 20px; height: 20px; }
  .icone-topo .caret {
    width: 0; height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 4px solid currentColor;
  }
  .icone-usuario[data-notificacoes]::after {
    content: attr(data-notificacoes);
    position: absolute;
    top: -9px; left: 10px;
    height: 12px;
    padding: 0 4px;
    border-radius: 12px;
    background: var(--destaque);
    color: white;
    font: bolder 9px/13px monospace;
  }

  /* ---------- Conteúdo ---------- */
  #container_conteudo {
    margin-top: 15px;
    padding: 15px;
    min-height: 600px;
  }
  /* Mesma grade do ERP: .row > .col-lg-1 (vazia) + .col-sm-6.col-lg-5 por cartão,
     com 15px de respiro lateral e margem inferior de 2% */
  .grade-programas {
    display: flex;
    flex-wrap: wrap;
    margin: 0 -15px;
  }
  .grade-programas > a {
    width: calc(50% - 30px);
    margin: 0 15px 2%;
  }
  @media (min-width: 1200px) {
    .grade-programas { padding-left: 8.3333%; }
    .grade-programas > a { width: calc(41.6667% - 30px); }
  }
  .botao-programa-menu {
    background-color: transparent;
    border: 1px solid var(--borda-botao);
    color: var(--texto);
  }
  .botao-programa-menu:hover { background-color: var(--hover-botao); }
  .botao-responsivo {
    position: relative;
    display: block;
    width: 100%;
    height: 80px;
    line-height: 80px;
    padding: 0 25px;
    border-radius: 15px;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 0.3px;
    text-align: left;
    overflow: hidden;
  }
  .texto-botao-responsivo { margin-left: 10px; }
  .icone-botao-menu {
    position: absolute;
    right: 30px; top: 20px;
    width: 40px; height: 40px;
    color: var(--destaque);
  }

  /* ---------- Botão flutuante ---------- */
  .flutuante {
    position: fixed;
    left: 20px; bottom: 20px;
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .flutuante svg { width: 34px; height: 34px; }
  .flutuante .ponto {
    position: absolute; top: 2px; right: 2px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--destaque);
  }

  /* ---------- Responsivo (mesmos pontos de quebra do original) ---------- */
  @media (max-width: 767px) {
    #sidebar { position: static; width: auto; padding: 0 16px; }
    .espacamento-itens-menu { margin: 10px 0; }
    #div_pesquisa_programa_menu { margin: 0; }
    #conteudo { margin-left: 0; padding: 15px 16px; }
    .grade-programas > a { width: calc(100% - 30px); }
    .botao-responsivo { height: 55px; line-height: 55px; }
    .icone-botao-menu { width: 30px; height: 30px; top: 12px; }
    .descricao-filial-menu { display: none; }
  }

  /* ---------- Protótipo ---------- */
  /* Nomes longos quebram em duas linhas, como no original (line-height 25px) */
  .botao-responsivo { display: flex; align-items: center; line-height: 25px; padding-right: 85px; }
  .vazio { padding: 40px 15px; text-align: center; color: #8e8e93; font-size: 16px; }
  .pendente { max-width: 640px; margin: 40px auto; text-align: center; font-size: 16px; line-height: 1.6; }
  .pendente h2 { font-weight: 400; font-size: 22px; margin: 0 0 10px; }
  .pendente a { color: #2f84ec; }
  .pendente img { max-width: 100%; border-radius: 10px; margin-top: 20px; box-shadow: var(--sombra); }
  .rotulo-grupo { font-size: 13px; color: #8e8e93; }

  /* Configurações: grupos em sanfona */
  .sanfona { display: flex; flex-direction: column; gap: 10px; }
  .sanfona details { border: 1px solid var(--borda-botao); border-radius: 10px; overflow: hidden; }
  .sanfona summary {
    cursor: pointer; padding: 12px 15px; font-size: 16px;
    background: rgba(127,127,127,0.08); list-style: none;
  }
  .sanfona summary::-webkit-details-marker { display: none; }
  .sanfona .lista { display: flex; flex-direction: column; padding: 10px 15px 15px; }
  .sanfona .lista span { padding: 10px 15px; background: #337ab7; color: #fff; border-radius: 6px 6px 0 0; }
  .sanfona .lista a { padding: 10px 15px; border: 1px solid var(--borda-botao); border-top: none; }
  .sanfona .lista a:last-child { border-radius: 0 0 6px 6px; }
  .sanfona .lista a:hover { background: var(--hover-botao); }

  .marca-erp { display: block; background: url(../assets/marca/logo.svg) no-repeat center / auto 48px; }
  @media (prefers-color-scheme: dark) {
    html[theme-mode=auto] .marca-erp { background-image: url(../assets/marca/logo_claro.svg); }
  }

  /* Ajustes do ERP sobre o Bootstrap 3 (valores lidos do CSS original) */
  #container_conteudo { font-family: 'Open Sans', sans-serif; font-size: 14px; color: var(--texto); }
  #container_conteudo a:not(.btn) { color: #2f84ec; }
  #container_conteudo .panel-title > a { color: inherit; }
  /* no ERP, rótulos, botões e cabeçalhos aparecem com peso normal */
  #container_conteudo label, #container_conteudo .btn, #container_conteudo th { font-weight: 500; }
  #container_conteudo .panel-title { font-weight: 500; }
  #container_conteudo .nav-tabs a { font-weight: 400; }
  .btn { outline: 0 !important; border-radius: 5px; }
  .painel-filtros-padroes, .painel-filtros-padroes > .panel-heading { background-color: #f5f5f5; }

  /* seleção múltipla com busca (Kit de Produto) */
  .Tokenize .TokensContainer { list-style: none; margin: 0; padding: 6px 12px; min-height: 58px; cursor: text;
    background: #fff; border: 1px solid #ccc; border-radius: 4px; }
  .Tokenize .Placeholder { color: #999; padding: 4px 0 0 24px; position: relative; }
  .Tokenize .lupa-multiselect-autocompletar { position: absolute; left: 0; top: 4px; width: 16px; height: 16px; }
  .Tokenize .lupa-multiselect-autocompletar:before { content: "\e003"; font-family: 'Glyphicons Halflings'; color: #ccc; font-size: 14px; }
  .Tokenize .TokenSearch input { border: 0; outline: 0; width: 5px; padding: 0; background: transparent; color: inherit; }
  .Tokenize .Dropdown { display: none; }
  .btn-primary, .btn-primary:hover, .btn-primary:focus, .btn-primary:active, .btn-primary.active {
    color: #fff; background-color: #2f84ec; border-color: transparent; }
  .modal-header { background-color: #2f84ec; color: #fff; }
  .nav > li > a:hover, .nav > li > a:focus { color: #2f84ec; }
  .sobre-a-lista { margin: 0 5px 10px 0; }
  .botao-muda-visualizacao-tabela { display: none; }
  .form-control { border-radius: 10px; }
  .panel { border-radius: 10px; }
  .panel-heading { border-top-left-radius: 10px; border-top-right-radius: 10px; }
  .panel-heading.collapsed { border-radius: 10px; }
  .panel-heading[data-toggle=collapse] { cursor: pointer; }
  .input-group-btn .btn { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
  .input-group .input-group-addon:last-child { border-top-right-radius: 10px !important; border-bottom-right-radius: 10px !important; }
  .container-pesquisa .input-group .form-control { border-top-left-radius: 10px !important; border-bottom-left-radius: 10px !important; }
  .tab-pane { padding-top: 20px; }
  .table thead { background-color: #2f84ec !important; color: #fff !important; }
  .table tbody { cursor: grab; }
  .div-table { overflow-x: auto; }
  .div-table .table { margin-bottom: 0; }
  .div-table .table thead { white-space: nowrap; }
  .nao-quebra-linha { white-space: nowrap; }
  table[data-sortable] th, table[data-sortable] td { text-align: left; padding: 10px; }
  table[data-sortable] thead th { border-bottom: 2px solid #e0e0e0; }
  .btn-group.grupo-botoes-radio > .opcao-componente-radio.btn:last-of-type { border-radius: 0 4px 4px 0; }
  .data-atualizacao-cadastro { text-align: right; color: #bbb; margin: 5px; }
  .static-value { padding-top: 7px; }
  .cursor-pointer { cursor: pointer; }
  .margem-inferior { margin-bottom: 15px; }

  #container_conteudo .nav-tabs > li.active > a { color: #555; }

  /* checkbox do ERP */
  input.checkbox { display: none; }
  input.checkbox + label { cursor: pointer; position: relative; padding-left: 35px; margin-right: 10px; color: #333; margin-top: 7px; min-height: 25px; }
  input.checkbox:disabled + label { cursor: default; }
  input.checkbox:disabled + label:before { opacity: 0.4; }
  input.checkbox + label:before, input.checkbox + label:after { content: ''; width: 25px; height: 25px; left: 0; bottom: 0; text-align: center; position: absolute; }
  input.checkbox + label:before { background-color: transparent; border: 2px solid #b1b0b0; border-radius: 3px; transition: all .3s ease-in-out; }
  input.checkbox:checked + label:before { box-shadow: inset 0 0 0 13px #2f84ec; border: 3px solid #2f84ec; }
  input.checkbox:checked + label:after { content: "\2713"; line-height: 26px; font-size: 18px; color: #fff; }
  /* controles que o ERP mantém ocultos até haver registro */
  .exclui-registro-relacionado + label, #remove_imagem_padrao_pessoa, #remove_imagem_padrao_produto { display: none; }
  #div_imagem_padrao_pessoa, #div_imagem_padrao_produto { position: relative; display: inline-block; }

  /* campos com busca (typeahead) */
  .input-group .twitter-typeahead { display: table-cell !important; width: 100%; }
  .twitter-typeahead .tt-input { position: relative !important; vertical-align: middle; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .tt-hint, .tt-dropdown-menu { display: none !important; }
  .twitter-typeahead .tt-input:not([disabled]):not([readonly]) { background-color: #fff !important; }
  .painel-filtros-padroes .panel-heading, .painel-filtros-padroes .panel-heading * { font-weight: 400; }

  /* bootstrap-switch: 100px, cada metade com 50px */
  .bootstrap-switch { display: inline-block; position: relative; overflow: hidden; width: 100px; border: 1px solid #ccc;
    border-radius: 4px; cursor: pointer; text-align: left; vertical-align: middle; line-height: 8px; user-select: none; }
  .bootstrap-switch .bootstrap-switch-container { display: inline-block; width: 150px; white-space: nowrap; transition: margin-left .5s; }
  .bootstrap-switch.bootstrap-switch-on .bootstrap-switch-container { margin-left: 0; }
  .bootstrap-switch.bootstrap-switch-off .bootstrap-switch-container { margin-left: -50px; }
  .bootstrap-switch .bootstrap-switch-handle-on, .bootstrap-switch .bootstrap-switch-handle-off, .bootstrap-switch .bootstrap-switch-label {
    display: inline-block !important; box-sizing: border-box; width: 50px; height: 100%; padding: 6px 0;
    font-size: 14px; line-height: 20px; text-align: center; cursor: pointer; vertical-align: top; }
  .bootstrap-switch .bootstrap-switch-handle-on.bootstrap-switch-primary { background: #2f84ec; color: #fff; }
  .bootstrap-switch .bootstrap-switch-handle-off.bootstrap-switch-default { background: #eee; color: #000; }
  .bootstrap-switch .bootstrap-switch-label { background: #fff; color: #333; margin: -1px 0; }
  .bootstrap-switch input { position: absolute !important; opacity: 0; z-index: -1; }

  /* envio de arquivo */
  .botao-upload-arquivo { position: absolute; width: 115px; border-bottom-right-radius: 0; border-top-right-radius: 0; }
  .campo-descricao-arquivo-upload { cursor: default !important; padding-left: 120px; }
  .campo-oculto-arquivo-upload { display: none !important; }

  /* abas do ERP: o painel ativo é mostrado pelo script abaixo */
  .tab-content > .tab-pane { display: none; }
  .tab-content > .tab-pane.active { display: block; }


  /* ---------- Tema escuro (valores do tema escuro do ERP) ---------- */
  @media (prefers-color-scheme: dark) {
    html[theme-mode=auto] #container_conteudo,
    html[theme-mode=auto] #container_conteudo label,
    html[theme-mode=auto] input.checkbox + label { color: #f5f5f5; }
    html[theme-mode=auto] .panel { background-color: #2c2c2e; }
    html[theme-mode=auto] .panel-default { border-color: #222; }
    html[theme-mode=auto] .panel-default > .panel-heading,
    html[theme-mode=auto] .painel-filtros-padroes > .panel-heading { background-color: #3a3a3c; color: #f5f5f5; border-color: #222; }
    html[theme-mode=auto] .painel-filtros-padroes { background-color: #2c2c2e; }
    html[theme-mode=auto] .form-control, html[theme-mode=auto] textarea,
    html[theme-mode=auto] .twitter-typeahead .tt-input:not([disabled]):not([readonly]) {
      background-color: #1c1c1e !important; color: #fff; border-color: #3a3a3c; }
    html[theme-mode=auto] .form-control[disabled], html[theme-mode=auto] .form-control[readonly] { background-color: #3a3a3c !important; }
    html[theme-mode=auto] .item_collapse_filtros .form-control { background-color: #2c2c2e !important; }
    html[theme-mode=auto] .input-group-addon { color: #f5f5f5; background-color: #1c1c1e; border-color: #222; }
    html[theme-mode=auto] .btn-default { color: #f5f5f5; background-color: #2c2c2e; border-color: #222; }
    html[theme-mode=auto] .btn-default:hover, html[theme-mode=auto] .btn-default:focus { color: #fff; background-color: #1c1c1e; border-color: #111; }
    html[theme-mode=auto] .nav-tabs { border-bottom-color: #1c1c1e; }
    html[theme-mode=auto] #container_conteudo .nav-tabs > li.active > a,
    html[theme-mode=auto] .nav-tabs > li.active > a:hover,
    html[theme-mode=auto] .nav-tabs > li.active > a:focus { color: #f5f5f5; background-color: #1c1c1e; border: 1px solid #2c2c2e; }
    html[theme-mode=auto] .nav-tabs > li > a:hover { border-color: #2c2c2e #2c2c2e #1c1c1e; background-color: transparent; }
    html[theme-mode=auto] .div-table { background-color: #222; }
    html[theme-mode=auto] table[data-sortable].sortable-theme-bootstrap { background-color: #48484a; color: #f5f5f5; }
    html[theme-mode=auto] .table-striped > tbody > tr:nth-of-type(odd) { background-color: #3a3a3c; }
    html[theme-mode=auto] .table-hover > tbody > tr:hover { background-color: #2c2c2e !important; }
    html[theme-mode=auto] .table-bordered, html[theme-mode=auto] .table-bordered td, html[theme-mode=auto] .table-bordered th { border-color: #222; }
    html[theme-mode=auto] .bootstrap-switch { border-color: #222; }
    html[theme-mode=auto] .bootstrap-switch .bootstrap-switch-handle-off.bootstrap-switch-default { color: #fff; background: #48484a; }
    html[theme-mode=auto] .bootstrap-switch .bootstrap-switch-label { color: #fff; background: #1f1f1f; }
    html[theme-mode=auto] .Tokenize .TokensContainer { background-color: #1c1c1e; color: #f5f5f5; border-color: #3a3a3c; }
    html[theme-mode=auto] .dropdown-menu, html[theme-mode=auto] .dropdown-menu > li > a { background-color: #2c2c2e; color: #f5f5f5; }
    html[theme-mode=auto] .modal-content, html[theme-mode=auto] .modal-footer { background-color: #1c1c1e; color: #f5f5f5; }
    html[theme-mode=auto] .img-thumbnail { background-color: #2c2c2e; border-color: #3a3a3c; }
    html[theme-mode=auto] .page-header { border-bottom-color: #3a3a3c; }
    html[theme-mode=auto] .list-group-item { background-color: #34424b; border-color: #20292e; }
    html[theme-mode=auto] .close { color: #fff; text-shadow: none; }
  }

  /* Layout do protótipo convive com o Bootstrap */
  #sidebar a, #barra_superior a { color: inherit; text-decoration: none; }
  #sidebar *, #barra_superior * { box-sizing: border-box; }
  #barra_superior .titulo { font-family: 'Work Sans', sans-serif; }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    $(this).find('input').prop('checked', !on);
  });
  // Botões de opção (Física / Jurídica / Estrangeira)
  $(document).on('click', '.opcao-componente-radio', function () {
    $(this).siblings('.opcao-componente-radio').removeClass('btn-primary').addClass('btn-default');
    $(this).removeClass('btn-default').addClass('btn-primary');
    $('input[type="hidden"][name="' + $(this).attr('name') + '"]').val($(this).val());
  });
  // Abas do ERP (li#cabecalho_aba_... > a[href="#aba-..."])
  $(document).on('click', 'li[id^="cabecalho_aba_"] > a', function (e) {
    e.preventDefault();
    var alvo = $($(this).attr('href'));
    $(this).closest('ul').children('li').removeClass('active');
    $(this).parent().addClass('active');
    alvo.siblings('.tab-pane').removeClass('active in');
    alvo.addClass('active in');
  });
  // Links sem destino no protótipo não recarregam a página
  $(document).on('click', 'a[href="#"]', function (e) { e.preventDefault(); });
</script>

</body>
